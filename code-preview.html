<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 미리보기 · HTML/CSS/JS 바로 실행</title>
<style>
  /* ── 밝은 테마(기본) ─────────────────────────── */
  :root{
    --bg:#f5f7fa;
    --panel:#ffffff;
    --panel-head:#fbfcfe;
    --line:#e2e8f0;
    --text:#1f2937;
    --muted:#6b7280;
    --brand:#2563eb;
    --brand-soft:#eff6ff;
    --brand-line:#dbeafe;
    --btn-bg:#ffffff;
    --btn-hover:#f1f5f9;
    --warn:#b45309;
    --warn-bg:#fffbeb;
    --err:#dc2626;
    --err-bg:#fef2f2;
    --editor-bg:#ffffff;
    --gutter-bg:#f8fafc;
    --gutter-fg:#94a3b8;
    --code-fg:#1f2937;
    --check-a:#f1f5f9;
    --check-b:#ffffff;
    --tok-tag:#22863a;
    --tok-attr:#6f42c1;
    --tok-str:#0a3069;
    --tok-cmt:#6a737d;
    --tok-kw:#d73a49;
    --tok-val:#005cc5;
    --tok-num:#005cc5;
    --tok-prop:#005cc5;
    --mono:"D2Coding","Consolas","Menlo","Monaco","Courier New",monospace;
    --fsize:13.5px;
    --lheight:1.6;
    --pad:12px;
  }
  /* ── 어두운 테마 ─────────────────────────────── */
  body.theme-dark{
    --bg:#0b1220;
    --panel:#111827;
    --panel-head:#0e1626;
    --line:#1f2937;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --brand:#38bdf8;
    --brand-soft:#0b2436;
    --brand-line:#164e63;
    --btn-bg:#182233;
    --btn-hover:#233045;
    --warn:#fbbf24;
    --warn-bg:#2a2410;
    --err:#f87171;
    --err-bg:#2d1417;
    --editor-bg:#0d1424;
    --gutter-bg:#0a0f1c;
    --gutter-fg:#475569;
    --code-fg:#e2e8f0;
    --check-a:#131c2e;
    --check-b:#0f1727;
    --tok-tag:#7ee787;
    --tok-attr:#d2a8ff;
    --tok-str:#a5d6ff;
    --tok-cmt:#8b949e;
    --tok-kw:#ff7b72;
    --tok-val:#79c0ff;
    --tok-num:#79c0ff;
    --tok-prop:#79c0ff;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ── 상단 툴바 ─────────────────────────────── */
  .topbar{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 14px 8px;
    flex:0 0 auto;
    position:relative;
    z-index:30;
  }
  .topbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .logo{font-size:17px;font-weight:700;margin:0;white-space:nowrap;}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px;}
  .grow{margin-left:auto;}
  button{
    font-family:inherit;
    font-size:13px;
    padding:7px 11px;
    border:1px solid var(--line);
    background:var(--btn-bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s,border-color .12s;
  }
  button:hover{background:var(--btn-hover);}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
  body:not(.theme-dark) button.primary:hover{background:#1d4ed8;}
  body.theme-dark button.primary{color:#06202e;}
  select{
    font-family:inherit;
    font-size:13px;
    padding:7px 9px;
    border:1px solid var(--line);
    background:var(--btn-bg);
    color:var(--text);
    border-radius:8px;
    cursor:pointer;
    max-width:210px;
  }
  .auto-run{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--muted);
    background:var(--brand-soft);
    border:1px solid var(--brand-line);
    padding:6px 10px;border-radius:8px;cursor:pointer;user-select:none;
  }
  .auto-run input{cursor:pointer;margin:0;}
  .hint{margin:8px 0 0;font-size:12.5px;color:var(--muted);}

  /* ── 라이브러리 패널 ───────────────────────── */
  .lib-wrap{position:relative;}
  .lib-panel{
    position:absolute;top:calc(100% + 6px);left:0;
    width:320px;max-width:88vw;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 12px 32px rgba(15,23,42,.18);
    padding:12px;
    z-index:40;
  }
  .lib-panel[hidden]{display:none;}
  .lib-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .lib-desc{font-size:12px;color:var(--muted);margin:6px 0 10px;line-height:1.55;}
  .net-badge{
    font-size:11px;font-weight:400;padding:2px 7px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);
  }
  .net-badge.off{color:var(--err);border-color:var(--err);}
  .lib-item{
    display:flex;align-items:center;gap:10px;
    padding:8px;border-radius:9px;border:1px solid var(--line);
    margin-bottom:6px;background:var(--btn-bg);
  }
  .lib-item .info{min-width:0;flex:1 1 auto;}
  .lib-item .nm{font-size:13px;font-weight:700;}
  .lib-item .ds{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .lib-item button{padding:5px 10px;font-size:12px;}
  .lib-item button.added{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand);cursor:default;}

  /* ── 작업 영역 ─────────────────────────────── */
  .workspace{
    --split:50%;
    flex:1 1 auto;display:flex;min-height:0;padding:10px;
  }
  .pane{
    display:flex;flex-direction:column;min-width:0;min-height:0;
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;
  }
  .pane-editor{flex:0 0 var(--split);}
  .pane-preview{flex:1 1 auto;}
  .pane-head{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-bottom:1px solid var(--line);
    background:var(--panel-head);font-size:13px;font-weight:700;
    white-space:nowrap;
  }
  .pane-head .sub{
    font-weight:400;font-size:12px;color:var(--muted);
    min-width:0;overflow:hidden;text-overflow:ellipsis;
  }
  .pane-head .spacer{margin-left:auto;}

  .pane-head button{padding:4px 8px;font-size:12px;}

  /* ── 에디터 탭 ─────────────────────────────── */
  .tabbar{
    flex:0 0 auto;display:flex;align-items:center;gap:3px;
    padding:6px 8px 0;border-bottom:1px solid var(--line);
    background:var(--panel-head);
  }
  .tabbar .tab{
    padding:5px 11px;font-size:12.5px;
    border:1px solid transparent;border-bottom:0;
    border-radius:7px 7px 0 0;background:transparent;color:var(--muted);
    position:relative;top:1px;
  }
  .tabbar .tab:hover{background:var(--btn-hover);}
  .tabbar .tab.active{
    background:var(--editor-bg);border-color:var(--line);
    color:var(--brand);font-weight:700;
  }
  .tab-note{
    margin-left:auto;padding-right:4px;
    font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }

  /* ── 디바이스 폭 전환 ──────────────────────── */
  .device-group{
    display:flex;gap:2px;padding:2px;
    border:1px solid var(--line);border-radius:8px;background:var(--btn-bg);
  }
  .device-group .dev{
    border:0;background:transparent;color:var(--muted);
    padding:4px 8px;font-size:12px;border-radius:6px;
  }
  .device-group .dev.active{
    background:var(--brand-soft);color:var(--brand);font-weight:700;
  }
  .preview-wrap.framed #preview{
    max-width:100%;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:0 0 24px rgba(15,23,42,.10);
  }

  /* ── 팝업(모달) ────────────────────────────── */
  .modal{
    position:fixed;inset:0;z-index:80;padding:16px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(15,23,42,.55);
  }
  .modal[hidden]{display:none;}
  .modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:430px;max-width:100%;max-height:86vh;overflow:auto;padding:16px;
    box-shadow:0 24px 60px rgba(15,23,42,.35);
  }
  .modal-head{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:700;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px;
  }
  .modal-head .spacer{margin-left:auto;}
  .modal-foot{display:flex;justify-content:flex-end;padding-top:12px;}
  .lib-item{cursor:pointer;}
  .lib-item input{width:17px;height:17px;cursor:pointer;flex:0 0 auto;}

  /* ── 에디터(줄 번호 + 구문 강조) ───────────── */
  .editor-shell{
    flex:1 1 auto;display:flex;min-height:0;overflow:hidden;background:var(--editor-bg);
  }
  .gutter{
    flex:0 0 54px;overflow:hidden;position:relative;
    background:var(--gutter-bg);border-right:1px solid var(--line);
  }
  .gutter-lines{
    position:absolute;top:0;left:0;right:0;
    padding:var(--pad) 8px var(--pad) 0;
    font-family:var(--mono);font-size:var(--fsize);line-height:var(--lheight);
    text-align:right;color:var(--gutter-fg);white-space:pre;
    user-select:none;
  }
  .code-box{position:relative;flex:1 1 auto;min-width:0;}
  .hl,#code{
    position:absolute;inset:0;
    margin:0;border:0;padding:var(--pad);
    font-family:var(--mono);font-size:var(--fsize);line-height:var(--lheight);
    tab-size:2;
    white-space:pre;
    word-break:normal;
    overflow-wrap:normal;
  }
  .hl{
    pointer-events:none;overflow:hidden;z-index:1;
    color:var(--code-fg);background:transparent;
  }
  .hl code{font:inherit;white-space:pre;display:block;width:max-content;min-width:100%;}
  #code{
    z-index:2;resize:none;outline:none;overflow:auto;
    background:transparent;color:transparent;caret-color:var(--brand);
  }
  #code::selection{background:rgba(56,132,255,.28);}
  /* 한글 입력(IME) 조합 중에는 강조 레이어를 숨기고 글자를 직접 보여준다 */
  .editor-shell.composing .hl{visibility:hidden;}
  .editor-shell.composing #code{color:var(--code-fg);}
  .editor-shell.plain .hl{visibility:hidden;}
  .editor-shell.plain #code{color:var(--code-fg);}

  .t-tag{color:var(--tok-tag);}
  .t-attr{color:var(--tok-attr);}
  .t-str{color:var(--tok-str);}
  .t-cmt{color:var(--tok-cmt);font-style:italic;}
  .t-kw{color:var(--tok-kw);}
  .t-val{color:var(--tok-val);}
  .t-num{color:var(--tok-num);}
  .t-prop{color:var(--tok-prop);}
  .t-doc{color:var(--tok-cmt);}

  /* ── 분할선 ────────────────────────────────── */
  .resizer{flex:0 0 10px;cursor:col-resize;display:flex;align-items:center;justify-content:center;}
  .resizer::before{content:"";width:3px;height:44px;border-radius:3px;background:#cbd5e1;}
  body.theme-dark .resizer::before{background:#334155;}
  .resizer:hover::before{background:var(--brand);}

  /* ── 미리보기 ──────────────────────────────── */
  .preview-wrap{
    flex:1 1 auto;min-height:0;
    background:
      linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),
      linear-gradient(45deg,var(--check-a) 25%,var(--check-b) 25%,var(--check-b) 75%,var(--check-a) 75%);
    background-size:18px 18px;background-position:0 0,9px 9px;
    display:flex;justify-content:center;overflow:auto;
  }
  #preview{width:100%;height:100%;border:0;background:#fff;display:block;}
  .preview-wrap.mobile #preview{
    width:375px;max-width:100%;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
  }
  .pane-preview.fullscreen{
    position:fixed;inset:0;z-index:60;border-radius:0;border:0;
  }

  /* ── 콘솔 ──────────────────────────────────── */
  .console{
    flex:0 0 auto;margin:0 10px 10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:10px;display:flex;flex-direction:column;overflow:hidden;
  }
  .console-head{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--line);background:var(--panel-head);
    font-size:13px;font-weight:700;cursor:pointer;user-select:none;
  }
  .console-head .spacer{margin-left:auto;}
  .console-head button{padding:4px 8px;font-size:12px;}
  .count{font-weight:400;font-size:12px;color:var(--muted);}
  .console-body{
    height:150px;overflow:auto;padding:6px 4px;
    font-family:var(--mono);font-size:12.5px;line-height:1.55;
    background:var(--panel);
  }
  .console.collapsed .console-body{display:none;}
  .console.collapsed .console-head{border-bottom:0;}
  .log{
    display:flex;gap:8px;padding:3px 8px;
    border-bottom:1px solid var(--line);
    white-space:pre-wrap;word-break:break-word;
  }
  .log .tag{flex:0 0 auto;font-size:11px;opacity:.75;}
  .log-log{color:var(--text);}
  .log-info{color:var(--tok-val);}
  .log-warn{color:var(--warn);background:var(--warn-bg);}
  .log-error{color:var(--err);background:var(--err-bg);font-weight:700;}
  .log-system{color:var(--muted);}
  .log-empty{color:var(--muted);padding:10px;font-family:inherit;font-size:12.5px;}

  /* ── 토스트 ────────────────────────────────── */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:#111827;color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;z-index:99;
  }
  body.theme-dark .toast{background:#e2e8f0;color:#0f172a;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ── 좁은 화면(768px 이하) ─────────────────── */
  @media (max-width:768px){
    /* 화면을 꽉 채우는 세로 flex 를 풀고 문서 흐름대로 쌓는다 */
    body{display:block;height:auto;overflow:auto;}
    .workspace{flex-direction:column;gap:8px;}
    .pane-editor{flex:0 0 280px !important;}
    .pane-preview{flex:0 0 320px;}
    .resizer{display:none;}
    .logo{font-size:15px;}
    .console-body{height:120px;}
    .gutter{flex-basis:42px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="logo">🧑‍💻 코드 미리보기</h1>
    <div class="toolbar">
      <button id="btnRun" class="primary" title="Ctrl+Enter (Mac은 Cmd+Enter)">▶ 실행</button>
      <label class="auto-run" title="타이핑을 멈추면 0.5초 뒤 자동으로 실행됩니다">
        <input type="checkbox" id="chkAuto"> 자동 실행
      </label>

      <select id="selPreset" title="강의용 예제를 골라 불러옵니다" aria-label="예제 선택"></select>

      <span class="sep"></span>


      <button id="btnLib" title="외부 라이브러리 불러오기 태그를 코드에 추가합니다">📚 라이브러리</button>

      <button id="btnFormat" title="태그 깊이에 맞춰 들여쓰기를 정리합니다">✨ 정렬</button>
      <button id="btnReset">🔄 초기화</button>
      <button id="btnCopy">📋 코드 복사</button>
      <button id="btnSave">💾 HTML 저장</button>
      <button id="btnOpen">🪟 새 탭에서 보기</button>
    </div>
    <span class="grow"></span>
    <button id="btnTheme" title="밝은 화면 / 어두운 화면 전환">🌙 어둡게</button>
  </div>
  <p class="hint">코드를 붙여넣고 ▶ 실행을 누르면 오른쪽에 결과가 나타납니다</p>
</header>

<main class="workspace" id="workspace">
  <section class="pane pane-editor">
    <div class="pane-head">
      ✏️ 코드를 입력하세요
      <span class="sub">HTML · CSS · JavaScript 한 칸에 모두</span>
      <span class="spacer"></span>
      <span class="sub" id="codeStats">0 자 / 0 줄</span>
    </div>

    <div class="tabbar" id="tabbar">
      <button class="tab active" data-tab="full" title="전체 HTML 문서를 한 칸에서 편집합니다">📄 통합 문서</button>
      <button class="tab" data-tab="html" title="&lt;body&gt; 안쪽만 보기">HTML</button>
      <button class="tab" data-tab="css" title="&lt;style&gt; 안쪽만 보기">CSS</button>
      <button class="tab" data-tab="js" title="&lt;script&gt; 안쪽만 보기">JS</button>
      <span class="tab-note" id="tabNote">전체 문서를 그대로 편집합니다</span>
    </div>
    <div class="editor-shell" id="editorShell">
      <div class="gutter" id="gutter"><div class="gutter-lines" id="gutterLines">1</div></div>
      <div class="code-box">
        <pre class="hl" id="hlPre" aria-hidden="true"><code id="hlCode"></code></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"
          wrap="off" aria-label="코드 입력창"></textarea>
      </div>
    </div>
  </section>

  <div class="resizer" id="resizer" title="드래그해서 폭을 조절하세요 (더블클릭하면 반반)"></div>

  <section class="pane pane-preview" id="previewPane">
    <div class="pane-head">
      👀 실행 결과
      <span class="spacer"></span>

      <span class="sub" id="widthLabel">100%</span>
      <span class="device-group" id="deviceGroup">
        <button class="dev active" data-w="full" title="데스크톱 (100%)">🖥️ 데스크톱</button>
        <button class="dev" data-w="768" title="태블릿 (768px)">💻 태블릿</button>
        <button class="dev" data-w="375" title="모바일 (375px)">📱 모바일</button>
      </span>
      <button id="btnReload" title="지금 화면을 그대로 다시 불러옵니다">🔄 새로고침</button>
      <button id="btnFull" title="Esc 키로 빠져나올 수 있습니다">⛶ 전체화면</button>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <iframe id="preview" title="실행 결과 미리보기"
        sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    </div>
  </section>
</main>

<section class="console" id="consolePane">
  <div class="console-head" id="consoleHead">
    🖥️ 콘솔
    <span class="count" id="logCount">메시지 0개</span>
    <span class="spacer"></span>
    <button id="btnClearLog">🧹 지우기</button>
    <button id="btnToggleConsole">🔽 접기</button>
  </div>
  <div class="console-body" id="consoleBody"></div>
</section>


<div class="modal" id="libModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      📚 외부 CDN 라이브러리 연동
      <span class="net-badge" id="netBadge">확인 중</span>
      <span class="spacer"></span>
      <button id="btnLibClose" title="닫기 (Esc)">✕</button>
    </div>
    <p class="lib-desc">
      체크한 라이브러리의 불러오기 태그가 <b>내 코드의 &lt;head&gt; 안에 직접 추가</b>됩니다.
      체크를 풀면 그 줄이 지워집니다. 보이는 코드 그대로 실행·저장되므로,
      💾 저장한 파일을 따로 열어도 똑같이 보입니다. <b>인터넷 연결이 필요합니다.</b>
    </p>
    <div id="libList"></div>
    <div class="modal-foot">

  function escHtml(s) {

  var JS_CLS = ['cmt', 'cmt', 'str', 'kw', 'val', 'num'];

  var CSS_RE = /(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(@[\w-]+)|(#[0-9a-fA-F]{3,8}\b)|([-a-zA-Z]+)(?=\s*:)|(\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg|fr)?\b)/g;
  var CSS_CLS = ['cmt', 'str', 'kw', 'num', 'prop', 'num'];

  function paint(src, re, classes) {
    var out = '', last = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(src))) {
      if (m[0].length === 0) { re.lastIndex++; continue; }
      out += escHtml(src.slice(last, m.index));
      var cls = 'num';
      for (var g = 1; g < m.length; g++) {
        if (m[g] !== undefined) { cls = classes[g - 1]; break; }
      }
      out += '<span class="t-' + cls + '">' + escHtml(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + escHtml(src.slice(last));
  }

  /* 따옴표 안의 > 를 무시하고 태그의 끝을 찾는다 */
  function tagEnd(s, i) {
    var q = null;
    for (var j = i + 1; j < s.length; j++) {
      var c = s.charAt(j);
      if (q) { if (c === q) { q = null; } }
      else if (c === '"' || c === "'") { q = c; }
      else if (c === '>') { return j + 1; }
    }
    return s.length;
  }

  function paintTag(t) {
    var m = /^<\/?[a-zA-Z][\w:-]*/.exec(t);
    if (!m) { return escHtml(t); }
    var out = '<span class="t-tag">' + escHtml(m[0]) + '</span>';
    var rest = t.slice(m[0].length);
    var re = /([\w:@.\-]+)(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+)|([\w:@.\-]+)/g;
    var last = 0, mm;
    while ((mm = re.exec(rest))) {
      out += escHtml(rest.slice(last, mm.index));
      if (mm[1] !== undefined) {
        out += '<span class="t-attr">' + escHtml(mm[1]) + '</span>' +
               escHtml(mm[2]) +
               '<span class="t-str">' + escHtml(mm[3]) + '</span>';
      } else {
        out += '<span class="t-attr">' + escHtml(mm[4]) + '</span>';
      }
      last = mm.index + mm[0].length;
    }
    return out + escHtml(rest.slice(last));
  }

  function highlight(src) {
    var out = '', i = 0, n = src.length;
    while (i < n) {
      var lt = src.indexOf('<', i);
      if (lt < 0) { out += escHtml(src.slice(i)); break; }
      if (lt > i) { out += escHtml(src.slice(i, lt)); i = lt; }

      if (src.substr(i, 4) === '<!--') {
        var ce = src.indexOf('-->', i + 4);
        ce = ce < 0 ? n : ce + 3;
        out += '<span class="t-cmt">' + escHtml(src.slice(i, ce)) + '</span>';
        i = ce;
        continue;
      }

      var head = /^<\/?([a-zA-Z][\w:-]*)/.exec(src.substr(i, 40));
      if (!head) {
        if (src.charAt(i + 1) === '!') {
          var de = src.indexOf('>', i);
          de = de < 0 ? n : de + 1;
          out += '<span class="t-doc">' + escHtml(src.slice(i, de)) + '</span>';
          i = de;
          continue;
        }
        out += '&lt;';
        i++;

      }

      var end = tagEnd(src, i);
      out += paintTag(src.slice(i, end));
      var name = head[1].toLowerCase();

  }

  /* 입력창에는 스크롤바가 생기고 강조 레이어에는 생기지 않는다.
     그만큼 강조 레이어에 여백을 더해 두 층의 스크롤 범위를 똑같이 맞춘다. */
  function syncMetrics() {
    var sbV = codeEl.offsetWidth - codeEl.clientWidth;
    var sbH = codeEl.offsetHeight - codeEl.clientHeight;
    hlPre.style.paddingRight = (12 + sbV) + 'px';
    hlPre.style.paddingBottom = (12 + sbH) + 'px';
  }

  function syncScroll() {
    hlPre.scrollTop = codeEl.scrollTop;
    hlPre.scrollLeft = codeEl.scrollLeft;
    gutterLines.style.transform = 'translateY(' + (-codeEl.scrollTop) + 'px)';
  }
  window.addEventListener('resize', function () { syncMetrics(); syncScroll(); });

  function updateStats() {
    var v = codeEl.value;
    var lines = v.split('\n').length;
    var txt = v.length.toLocaleString('ko-KR') + ' 자 / ' + lines.toLocaleString('ko-KR') + ' 줄';
    if (activeTab !== 'full') {
      txt = txt + ' · 전체 ' + fullCode.split('\n').length.toLocaleString('ko-KR') + ' 줄 중 ' +
            region.line + '~' + (region.line + lines - 1) + '번째';
    }
    statsEl.textContent = txt;
  }

  /* ══════════════════════════════════════════════
     4-2. 통합 문서 / HTML / CSS / JS 탭
     통합 문서가 원본이고, 나머지 탭은 그 안의 한 구간을 보여주는 창이다.
     저장·실행·다운로드는 언제나 통합 문서 기준이라 줄 번호가 어긋나지 않는다.
     ══════════════════════════════════════════════ */
  function lineOf(text, pos) {
    return text.slice(0, pos).split('\n').length;
  }

  function findRegion(tab, src) {
    if (tab === 'full') { return { start: 0, end: src.length }; }

    if (tab === 'css') {
      var m = /<style[^>]*>/i.exec(src);
      if (!m) { return null; }
      var s = m.index + m[0].length;
      var e = src.toLowerCase().indexOf('</style>', s);
      return { start: s, end: e < 0 ? src.length : e };
    }

    if (tab === 'js') {
      var re = /<script([^>]*)>/gi, mm;
      while ((mm = re.exec(src))) {
        if (/\ssrc\s*=/i.test(mm[1])) { continue; }
        var s2 = mm.index + mm[0].length;
        var e2 = src.toLowerCase().indexOf('<' + '/script>', s2);
        return { start: s2, end: e2 < 0 ? src.length : e2 };
      }
      return null;
    }

    /* HTML 탭: <body> 안쪽에서 <style>/<script> 가 시작되기 전까지 */
    var b = /<body[^>]*>/i.exec(src);
    var s3 = b ? b.index + b[0].length : 0;
    var stop = /<script[\s>]|<style[\s>]|<\/body>/i.exec(src.slice(s3));
    return { start: s3, end: stop ? s3 + stop.index : src.length };
  }

  /* 입력창에 보이는 구간을 통합 문서에 되돌려 쓴다 */
  function syncFromTextarea() {
    if (activeTab === 'full') {
      fullCode = codeEl.value;
    } else {
      fullCode = fullCode.slice(0, region.start) + codeEl.value + fullCode.slice(region.end);
      region.end = region.start + codeEl.value.length;
    }
  }

  function updateTabUI() {
    [].forEach.call(document.querySelectorAll('#tabbar .tab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === activeTab);
    });
    $('tabNote').textContent = (activeTab === 'full')
      ? '전체 문서를 그대로 편집합니다'
      : '통합 문서의 ' + region.line + '번째 줄부터 · 실행·저장은 전체 문서 기준';
  }

  function createRegion(tab, src) {
    if (tab === 'css') {
      var m = /([ \t]*)<\/head>/i.exec(src);
      var block = '  <style>\n  </style>\n';
      if (m) { return src.slice(0, m.index) + (m[1] || '') + block + src.slice(m.index); }
      return block + src;
    }
    var m2 = /([ \t]*)<\/body>/i.exec(src);
    var block2 = '  <scr' + 'ipt>\n  <\/scr' + 'ipt>\n';
    if (m2) { return src.slice(0, m2.index) + (m2[1] || '') + block2 + src.slice(m2.index); }
    return src + '\n' + block2;
  }

  function setTab(tab) {
    if (tab === activeTab) { return true; }
    syncFromTextarea();

    var r = findRegion(tab, fullCode);
    if (!r) {
      var what = (tab === 'css') ? 'CSS(<style>) 부분' : 'JavaScript(<script>) 부분';
      if (!confirm('이 코드에는 아직 ' + what + '이 없습니다.\n새로 만들고 그 탭으로 갈까요?')) { return false; }
      fullCode = createRegion(tab, fullCode);
      r = findRegion(tab, fullCode);
      if (!r) { return false; }
    }

    activeTab = tab;
    region = { start: r.start, end: r.end, line: lineOf(fullCode, r.start) };
    codeEl.value = fullCode.slice(r.start, r.end);
    codeEl.scrollTop = codeEl.scrollLeft = 0;
    updateTabUI();
    afterCodeChange();
    return true;
  }

  [].forEach.call(document.querySelectorAll('#tabbar .tab'), function (b) {
    b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); });
  });

  /* ══════════════════════════════════════════════
     5. 코드 정렬(들여쓰기 정리)
     ══════════════════════════════════════════════ */
  var VOID_TAGS = ['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'];

  function reindentInner(inner, pad) {
    var body = inner.replace(/^[\r\n]+/, '').replace(/\s+$/, '');
    if (body === '') { return ''; }
    var lines = body.replace(/\t/g, '  ').split('\n');
    var min = Infinity;
    lines.forEach(function (l) {
      if (l.trim()) { min = Math.min(min, l.match(/^ */)[0].length); }
    });
    if (!isFinite(min)) { min = 0; }
    return lines.map(function (l) {
      return l.trim() ? pad + l.slice(min) : '';
    }).join('\n');
  }

  function formatHtml(src) {
    var blocks = [];
    var work = src.replace(/<(script|style|pre|textarea)([^>]*)>([\s\S]*?)<\/\1\s*>/gi,
      function (whole, tag, attrs, inner) {
        blocks.push({ tag: tag.toLowerCase(), attrs: attrs, inner: inner });
        return '' + (blocks.length - 1) + '';
      });

    var out = [], depth = 0, i = 0, n = work.length;
    var pad = function (d) { return new Array(Math.max(0, d) + 1).join('  '); };

    function pushBlock(bi, d) {
      var b = blocks[bi];
      var open = '<' + b.tag + b.attrs + '>';
      var close = '</' + b.tag + '>';
      if (b.tag === 'pre' || b.tag === 'textarea') {
        out.push(pad(d) + open + b.inner + close);
      } else {
        var inner = reindentInner(b.inner, pad(d + 1));
        out.push(pad(d) + open);
        if (inner) { out.push(inner); }
        out.push(pad(d) + close);
      }
    }

    function pushText(txt, d) {
      var parts = txt.split(/(\d+)/);
      for (var p = 0; p < parts.length; p++) {
        if (p % 2 === 1) { pushBlock(Number(parts[p]), d); continue; }
        parts[p].split('\n').forEach(function (line) {
          var t = line.trim();
          if (t) { out.push(pad(d) + t); }
        });
      }
    }

    while (i < n) {
      var lt = work.indexOf('<', i);
      if (lt < 0) { pushText(work.slice(i), depth); break; }
      if (lt > i) { pushText(work.slice(i, lt), depth); i = lt; }

      if (work.substr(i, 4) === '<!--') {
        var ce = work.indexOf('-->', i + 4);
        ce = ce < 0 ? n : ce + 3;
        out.push(pad(depth) + work.slice(i, ce).trim());
        i = ce;
        continue;
      }

      var head = /^<\/?([a-zA-Z][\w:-]*)/.exec(work.substr(i, 40));
      if (!head) {
        var de = work.indexOf('>', i);
        de = de < 0 ? n : de + 1;
        out.push(pad(depth) + work.slice(i, de).trim());
        i = de;
        continue;
      }

      var end = tagEnd(work, i);
      var raw = work.slice(i, end);
      var name = head[1].toLowerCase();
      var isClose = work.charAt(i + 1) === '/';
      var isSelf = /\/>$/.test(raw) || VOID_TAGS.indexOf(name) !== -1;

      if (isClose) {
        depth = Math.max(0, depth - 1);
        out.push(pad(depth) + raw);
        i = end;
        continue;
      }

      /* <p>짧은 글</p> 처럼 안에 태그가 없고 짧으면 한 줄로 둔다 */
      if (!isSelf) {
        var nextLt = work.indexOf('<', end);
        if (nextLt >= 0 && new RegExp('^<\/' + name + '\s*>', 'i').test(work.slice(nextLt))) {
          var between = work.slice(end, nextLt);
          if (between.indexOf('\u0001') === -1 && between.indexOf('\n') === -1) {
            var closeEnd = tagEnd(work, nextLt);
            var oneLine = raw + between.trim() + work.slice(nextLt, closeEnd);
            if (oneLine.length <= 100) {
              out.push(pad(depth) + oneLine);
              i = closeEnd;
              continue;
            }
          }
        }
      }

      out.push(pad(depth) + raw);
      if (!isSelf) { depth++; }
      i = end;
    }

    return out.join('\n').replace(/\n{3,}/g, '\n\n');
  }

  /* ══════════════════════════════════════════════
     6. iframe 후킹 스크립트 + 실행
     ══════════════════════════════════════════════ */
  function hookSource() {
    var fn = function () {
      var send = function (level, text, line) {
        try {
          parent.postMessage({ __codePreview: true, level: level, text: text, line: line }, '*');
        } catch (e) {}
      };
      var ser = function (v, depth, seen) {
        if (v === null) { return 'null'; }
        var t = typeof v;
        if (t === 'undefined') { return 'undefined'; }
        if (t === 'string') { return depth > 0 ? '"' + v + '"' : v; }
        if (t === 'number' || t === 'boolean' || t === 'bigint' || t === 'symbol') { return String(v); }
        if (t === 'function') { return 'ƒ ' + (v.name || 'anonymous') + '()'; }
        if (v instanceof Error) { return v.name + ': ' + v.message; }
        if (typeof Element !== 'undefined' && v instanceof Element) {
          return '<' + v.tagName.toLowerCase() + (v.id ? ' id="' + v.id + '"' : '') + '>';
        }
        if (seen.indexOf(v) !== -1) { return '[순환 참조]'; }
        var isArray = Object.prototype.toString.call(v) === '[object Array]';
        if (depth > 2) { return isArray ? '[...]' : '{...}'; }
        seen.push(v);
        var out;
        try {
          if (isArray) {
            var arr = [];
            for (var i = 0; i < v.length && i < 50; i++) { arr.push(ser(v[i], depth + 1, seen)); }
            if (v.length > 50) { arr.push('외 ' + (v.length - 50) + '개'); }
            out = '[' + arr.join(', ') + ']';
          } else {
            var keys = Object.keys(v);
            var parts = [];
            for (var j = 0; j < keys.length && j < 30; j++) {
              parts.push(keys[j] + ': ' + ser(v[keys[j]], depth + 1, seen));
            }
            if (keys.length > 30) { parts.push('...'); }
            out = '{' + parts.join(', ') + '}';
          }
        } catch (e) { out = String(v); }
        seen.pop();
        return out;
      };
      var join = function (args) {
        var parts = [];
        for (var i = 0; i < args.length; i++) { parts.push(ser(args[i], 0, [])); }
        return parts.join(' ');
      };
      var wrap = function (name, level) {
        var original = console[name];
        console[name] = function () {
          send(level, join(arguments), null);
          if (original) { try { original.apply(console, arguments); } catch (e) {} }
        };
      };
      wrap('log', 'log');
      wrap('info', 'info');
      wrap('debug', 'log');
      wrap('warn', 'warn');
      wrap('error', 'error');
      console.table = function (v) { send('log', ser(v, 0, []), null); };
      window.onerror = function (message, source, lineno) {
        send('error', String(message), lineno || null);
        return false;
      };
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        var msg = (r && r.message) ? (r.name + ': ' + r.message) : ser(r, 0, []);
        send('error', '처리되지 않은 Promise 오류 - ' + msg, null);
      });
      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
          send('warn', '외부 파일을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요 - ' + (t.src || t.href), null);
        }
      }, true);
      window.addEventListener('load', function () {
        send('system', '실행이 끝났습니다.', null);
      });
    };
    return '<scr' + 'ipt>(' + fn.toString().replace(/\s*\n\s*/g, ' ') + ')();<\/scr' + 'ipt>';
  }

  /* 후킹 스크립트는 줄바꿈이 없는 한 줄이라 사용자 코드의 줄 번호가 그대로 유지된다 */
  function buildDocument(userCode) {
    var hook = hookSource();
    var patterns = [/<head[^>]*>/i, /<html[^>]*>/i, /<!doctype[^>]*>/i];
    for (var i = 0; i < patterns.length; i++) {
      var m = userCode.match(patterns[i]);
      if (m) {
        var at = m.index + m[0].length;
        return userCode.slice(0, at) + hook + userCode.slice(at);
      }
    }
    return hook + userCode;
  }

  /* ══════════════════════════════════════════════
     7. 콘솔
     ══════════════════════════════════════════════ */
  var TAGS = { log: '📄', info: 'ℹ️', warn: '⚠️', error: '⛔', system: '✅' };

  function updateLogCount() {
    logCountEl.textContent = '메시지 ' + logCount + '개';
  }

  function clearConsole() {
    consoleBody.innerHTML = '';
    logCount = 0;
    updateLogCount();
    var p = document.createElement('div');
    p.className = 'log-empty';
    p.id = 'logEmpty';
    p.textContent = '여기에 console.log 출력과 오류 메시지가 표시됩니다.';
    consoleBody.appendChild(p);
  }

  function addLog(level, text, line) {
    var empty = $('logEmpty');
    if (empty && empty.parentNode) { empty.parentNode.removeChild(empty); }
    var row = document.createElement('div');
    row.className = 'log log-' + (TAGS[level] ? level : 'log');
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = TAGS[level] || '📄';
    var body = document.createElement('span');
    body.textContent = (line ? '[' + line + '번째 줄] ' : '') + text;
    row.appendChild(tag);
    row.appendChild(body);
    consoleBody.appendChild(row);
    consoleBody.scrollTop = consoleBody.scrollHeight;
    if (level !== 'system') { logCount++; updateLogCount(); }
    if (level === 'error' && consolePane.classList.contains('collapsed')) { setConsoleCollapsed(false); }
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.__codePreview !== true) { return; }
    if (previewEl.contentWindow && ev.source !== previewEl.contentWindow) { return; }
    addLog(d.level, d.text, d.line);
  });

  /* ══════════════════════════════════════════════
     8. 실행 / 저장 / 복원
     ══════════════════════════════════════════════ */
  function run() {
    clearConsole();
    lastDoc = buildDocument(fullCode);
    previewEl.srcdoc = lastDoc;
  }

  function reloadPreview() {
    if (!lastDoc) { run(); return; }
    clearConsole();
    var doc = lastDoc;
    previewEl.srcdoc = '';
    setTimeout(function () { previewEl.srcdoc = doc; }, 0);
  }

  function scheduleAutoRun() {
    if (!chkAuto.checked) { return; }
    clearTimeout(autoTimer);
    autoTimer = setTimeout(run, 500);
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, fullCode); } catch (e) {}
  }

  function afterCodeChange() {
    save();
    updateStats();
    updateGutter();
    repaint();
    refreshLibButtons();
    scheduleAutoRun();
  }

  /* 되돌리기(Ctrl+Z)가 살아 있도록 execCommand 로 바꾼다 */
  function setCode(text, caretAtTop) {
    if (activeTab !== 'full') { setTab('full'); }
    var ok = false;
    try {
      codeEl.focus();
      codeEl.select();
      ok = document.execCommand('insertText', false, text);
    } catch (e) { ok = false; }
    if (!ok) {
      codeEl.value = text;
      afterCodeChange();
    }
    if (caretAtTop !== false) {
      codeEl.selectionStart = codeEl.selectionEnd = 0;
      codeEl.scrollTop = codeEl.scrollLeft = 0;
      syncScroll();
    }
  }

  function insertAt(pos, text) {
    var ok = false;
    try {
      codeEl.focus();
      codeEl.setSelectionRange(pos, pos);
      ok = document.execCommand('insertText', false, text);
    } catch (e) { ok = false; }
    if (!ok) {
      codeEl.value = codeEl.value.slice(0, pos) + text + codeEl.value.slice(pos);
      afterCodeChange();
    }
  }

  /* ══════════════════════════════════════════════
     9. 토스트
     ══════════════════════════════════════════════ */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ══════════════════════════════════════════════
     10. 예제 드롭다운
     ══════════════════════════════════════════════ */
  (function buildPresetSelect() {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '📂 예제 불러오기...';
    selPreset.appendChild(opt);
    PRESETS.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name;
      selPreset.appendChild(o);
    });
  })();

  function isPresetCode(text) {
    return PRESETS.some(function (p) { return p.code === text; });
  }

  selPreset.addEventListener('change', function () {
    var id = selPreset.value;
    selPreset.value = '';
    if (!id) { return; }
    var preset = PRESETS.filter(function (p) { return p.id === id; })[0];
    if (!preset) { return; }

    if (fullCode.trim() !== '' && !isPresetCode(fullCode)) {
      if (!confirm('지금 작성한 코드가 예제로 바뀝니다. 계속할까요?')) { return; }
    }
    setCode(preset.code);
    run();
    toast(preset.name.replace(/^\d+\.\s*/, '') + ' 예제를 불러왔습니다');
  });

  /* ══════════════════════════════════════════════
     11. 라이브러리 삽입
     ══════════════════════════════════════════════ */

  (function buildLibList() {
    var list = $('libList');
    LIBS.forEach(function (lib) {
      var label = document.createElement('label');
      label.className = 'lib-item';
      var info = document.createElement('div');
      info.className = 'info';
      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = lib.name;
      var ds = document.createElement('div');
      ds.className = 'ds';
      ds.textContent = lib.desc;
      info.appendChild(nm);
      info.appendChild(ds);
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.setAttribute('data-lib', lib.id);
      label.appendChild(info);
      label.appendChild(chk);
      list.appendChild(label);
    });
  })();

  function refreshLibButtons() {
    LIBS.forEach(function (lib) {
      var chk = libPanel.querySelector('input[data-lib="' + lib.id + '"]');
      if (chk) { chk.checked = fullCode.indexOf(lib.key) !== -1; }
    });
  }

  function addLibTag(src, lib) {
    var m = /([ \t]*)<\/head>/i.exec(src);
    if (m) {
      return src.slice(0, m.index) + (m[1] || '') + '  ' + lib.tag + '\n' + src.slice(m.index);
    }
    return lib.tag + '\n' + src;
  }

  function removeLibTag(src, lib) {
    return src.split('\n').filter(function (l) { return l.indexOf(lib.key) === -1; }).join('\n');
  }

  function applyLibs() {
    var src = fullCode, added = 0, removed = 0;
    LIBS.forEach(function (lib) {
      var chk = libPanel.querySelector('input[data-lib="' + lib.id + '"]');
      if (!chk) { return; }
      var has = src.indexOf(lib.key) !== -1;
      if (chk.checked && !has) { src = addLibTag(src, lib); added++; }
      if (!chk.checked && has) { src = removeLibTag(src, lib); removed++; }
    });
    closeLibModal();
    if (!added && !removed) { toast('바뀐 내용이 없습니다'); return; }
    setCode(src);
    run();
    var msg = [];
    if (added) { msg.push(added + '개 추가'); }
    if (removed) { msg.push(removed + '개 제거'); }
    toast('라이브러리를 ' + msg.join(', ') + '했습니다' + (navigator.onLine ? '' : ' (지금은 오프라인입니다)'));
  }

  function openLibModal() {
    syncFromTextarea();
    updateNetBadge();
    refreshLibButtons();
    libPanel.hidden = false;
  }

  function closeLibModal() { libPanel.hidden = true; }

  function updateNetBadge() {
    var badge = $('netBadge');
    var on = navigator.onLine;
    badge.textContent = on ? '인터넷 연결됨' : '오프라인';
    badge.classList.toggle('off', !on);
  }
  window.addEventListener('online', updateNetBadge);
  window.addEventListener('offline', updateNetBadge);

  $('btnLib').addEventListener('click', openLibModal);
  $('btnLibClose').addEventListener('click', closeLibModal);
  $('btnLibApply').addEventListener('click', applyLibs);
  libPanel.addEventListener('click', function (e) {
    if (e.target === libPanel) { closeLibModal(); }
  });

  /* ══════════════════════════════════════════════
     12. 툴바
     ══════════════════════════════════════════════ */
  $('btnRun').addEventListener('click', run);
  $('btnReload').addEventListener('click', function () {
    reloadPreview();
    toast('미리보기를 다시 불러왔습니다');
  });

  $('btnFormat').addEventListener('click', function () {
    if (activeTab !== 'full') { setTab('full'); }
    var before = fullCode;
    var after;
    try {
      after = formatHtml(before);
    } catch (e) {
      toast('정렬하지 못했습니다. 코드를 확인해 주세요');
      return;
    }
    if (after === before) { toast('이미 정리된 코드입니다'); return; }
    setCode(after, false);
    toast('들여쓰기를 정리했습니다 (Ctrl+Z로 되돌리기)');
  });

  $('btnReset').addEventListener('click', function () {
    if (!confirm('입력한 코드를 지우고 샘플 코드로 되돌릴까요?')) { return; }
    setCode(SAMPLE);
    run();
    toast('샘플 코드로 되돌렸습니다');
  });

  $('btnCopy').addEventListener('click', function () {
    var fallback = function () {
      codeEl.focus();
      codeEl.select();
      try { document.execCommand('copy'); toast('복사됨!'); }
      catch (e) { toast('복사에 실패했습니다. Ctrl+C를 눌러주세요'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullCode).then(function () { toast('복사됨!'); }, fallback);
    } else {
      fallback();
    }
  });

  $('btnSave').addEventListener('click', function () {
    var blob = new Blob([fullCode], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'my-code.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('my-code.html 파일로 저장했습니다');
  });

  $('btnOpen').addEventListener('click', function () {
    var win = window.open('', '_blank');
    if (!win) { toast('팝업이 차단되었습니다. 주소창의 차단 해제를 눌러주세요'); return; }
    try {
      win.document.open();
      win.document.write(fullCode);
      win.document.close();
    } catch (e) {
      toast('새 탭에서 열 수 없습니다');
    }
  });


  function setDevice(w) {
    previewEl.style.width = (w === 'full') ? '100%' : w + 'px';
    previewWrap.classList.toggle('framed', w !== 'full');
    widthLabel.textContent = (w === 'full') ? '100%' : w + 'px';
    [].forEach.call(document.querySelectorAll('#deviceGroup .dev'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-w') === w);
    });
  }
  [].forEach.call(document.querySelectorAll('#deviceGroup .dev'), function (b) {
    b.addEventListener('click', function () { setDevice(b.getAttribute('data-w')); });
  });

  function setFullscreen(on) {
    previewPane.classList.toggle('fullscreen', on);
    $('btnFull').textContent = on ? '✖ 닫기' : '⛶ 전체화면';
  }
  $('btnFull').addEventListener('click', function () {
    setFullscreen(!previewPane.classList.contains('fullscreen'));
  });

  $('btnTheme').addEventListener('click', function () {
    var dark = !document.body.classList.contains('theme-dark');
    applyTheme(dark);
    try { localStorage.setItem(STORAGE_THEME, dark ? 'dark' : 'light'); } catch (e) {}
  });

  function applyTheme(dark) {
    document.body.classList.toggle('theme-dark', dark);
    $('btnTheme').textContent = dark ? '☀️ 밝게' : '🌙 어둡게';
  }

  chkAuto.addEventListener('change', function () {
    try { localStorage.setItem(STORAGE_AUTO, chkAuto.checked ? '1' : '0'); } catch (e) {}
    if (chkAuto.checked) { scheduleAutoRun(); }
  });

  /* ══════════════════════════════════════════════
     13. 콘솔 접기 / 펼치기
     ══════════════════════════════════════════════ */
  function setConsoleCollapsed(collapsed) {
    consolePane.classList.toggle('collapsed', collapsed);
    $('btnToggleConsole').textContent = collapsed ? '🔼 펼치기' : '🔽 접기';
  }
  $('btnToggleConsole').addEventListener('click', function (e) {
    e.stopPropagation();
    setConsoleCollapsed(!consolePane.classList.contains('collapsed'));
  });
  $('consoleHead').addEventListener('click', function () {
    setConsoleCollapsed(!consolePane.classList.contains('collapsed'));
  });
  $('btnClearLog').addEventListener('click', function (e) {
    e.stopPropagation();
    clearConsole();
  });

  /* ══════════════════════════════════════════════
     14. 입력창
     ══════════════════════════════════════════════ */
  codeEl.addEventListener('compositionstart', function () {
    composing = true;
    editorShell.classList.add('composing');
  });
  codeEl.addEventListener('compositionend', function () {
    composing = false;
    editorShell.classList.remove('composing');
    repaint();
  });

  codeEl.addEventListener('scroll', syncScroll);

  codeEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { escapePressed = true; return; }

    if (e.key === 'Tab' && !escapePressed) {
      e.preventDefault();
      var start = codeEl.selectionStart;
      var end = codeEl.selectionEnd;
      var val = codeEl.value;
      if (start === end && !e.shiftKey) {
        insertAt(start, '  ');
      } else {
        var lineStart = val.lastIndexOf('\n', start - 1) + 1;
        var block = val.slice(lineStart, end);
        var changed = e.shiftKey ? block.replace(/^ {1,2}/gm, '') : block.replace(/^/gm, '  ');
        var ok = false;
        try {
          codeEl.setSelectionRange(lineStart, end);
          ok = document.execCommand('insertText', false, changed);
        } catch (err) { ok = false; }
        if (!ok) {
          codeEl.value = val.slice(0, lineStart) + changed + val.slice(end);
          afterCodeChange();
        }
        codeEl.selectionStart = lineStart;
        codeEl.selectionEnd = lineStart + changed.length;
      }
      return;
    }
    escapePressed = false;

    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      run();
    }
  });

  codeEl.addEventListener('input', function () {
    syncFromTextarea();
    if (composing) { updateStats(); updateGutter(); save(); return; }
    afterCodeChange();
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target !== codeEl) {
      e.preventDefault();
      run();
    }
    if (e.key === 'Escape') {
      if (previewPane.classList.contains('fullscreen')) { setFullscreen(false); }
      if (!libPanel.hidden) { libPanel.hidden = true; }
    }
  });

  /* ══════════════════════════════════════════════
     15. 좌우 분할선 드래그
     ══════════════════════════════════════════════ */
  (function () {
    var dragging = false;
    function move(clientX) {
      var rect = workspace.getBoundingClientRect();
      var pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.min(85, Math.max(15, pct));
      workspace.style.setProperty('--split', pct.toFixed(2) + '%');
    }
    resizer.addEventListener('mousedown', function (e) {
      dragging = true;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      previewEl.style.pointerEvents = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) { if (dragging) { move(e.clientX); } });
    document.addEventListener('mouseup', function () {
      if (!dragging) { return; }
      dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      previewEl.style.pointerEvents = '';
    });
    resizer.addEventListener('touchmove', function (e) {
      if (e.touches[0]) { move(e.touches[0].clientX); e.preventDefault(); }
    }, { passive: false });
    resizer.addEventListener('dblclick', function () {
      workspace.style.setProperty('--split', '50%');
    });
  })();

  /* ══════════════════════════════════════════════
     16. 시작
     ══════════════════════════════════════════════ */
  (function start() {
    var saved = null, theme = null;
    try {
      saved = localStorage.getItem(STORAGE_KEY);
      chkAuto.checked = localStorage.getItem(STORAGE_AUTO) === '1';
      theme = localStorage.getItem(STORAGE_THEME);
    } catch (e) {}

    applyTheme(theme === 'dark');
    fullCode = (saved !== null && saved !== '') ? saved : SAMPLE;
    codeEl.value = fullCode;
    updateTabUI();

    updateStats();
    updateGutter();
    repaint();
    updateNetBadge();
    refreshLibButtons();
    clearConsole();
    run();
  })();
})();
</script>
</body>
</html>
